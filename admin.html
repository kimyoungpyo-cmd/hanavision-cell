<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>하나비전교회 사역자 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%;
            width: 32px; height: 32px; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen pb-20">

    <div class="max-w-2xl mx-auto bg-white min-h-screen shadow-xl sm:my-6 sm:rounded-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-700 text-white p-6 shadow-md">
            <h1 class="text-2xl font-bold tracking-tight">사역자 실시간 대시보드</h1>
            <p class="text-blue-100 text-sm mt-1">하나비전교회 속회 주일예배보고 현황</p>
        </div>

        <!-- Filter & Controls -->
        <div class="p-5 bg-blue-50 border-b space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- 날짜별 필터링 -->
                <div>
                    <label for="filterDate" class="block text-xs font-semibold text-blue-900 mb-1">📅 주일 날짜 선택</label>
                    <select id="filterDate" class="w-full p-2.5 bg-white border border-blue-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                        <option value="전체">전체 날짜 모아보기 (최신순)</option>
                    </select>
                </div>
                <!-- 교구별 필터링 -->
                <div>
                    <label for="filterDistrict" class="block text-xs font-semibold text-blue-900 mb-1">⛪ 교구별 필터링</label>
                    <select id="filterDistrict" class="w-full p-2.5 bg-white border border-blue-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                        <option value="전체">전체 교구 보기</option>
                        <option value="1교구">1교구</option>
                        <option value="2교구">2교구</option>
                        <option value="3교구">3교구</option>
                        <option value="4교구">4교구</option>
                        <option value="남성교구">남성교구</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end pt-1">
                <button onclick="loadReports()" class="w-full sm:w-auto px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm shadow transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    새로고침
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="p-5">
            <!-- Loading -->
            <div id="loadingStatus" class="text-center py-16 fade-in">
                <div class="loader mb-3"></div>
                <p class="text-sm text-gray-500 font-medium">보고서 데이터를 실시간으로 불러오는 중입니다...</p>
            </div>

            <!-- Summary Cards -->
            <div id="summaryCards" class="grid grid-cols-2 gap-4 mb-6 hidden fade-in">
                <div class="bg-blue-50 border border-blue-100 p-4 rounded-2xl shadow-sm text-center">
                    <p class="text-xs text-blue-600 font-semibold mb-1">조회된 속회 보고</p>
                    <p id="totalReportCount" class="text-2xl font-black text-blue-900">0개</p>
                </div>
                <div class="bg-green-50 border border-green-100 p-4 rounded-2xl shadow-sm text-center">
                    <p class="text-xs text-green-600 font-semibold mb-1">선택 조건 총 출석</p>
                    <p id="totalPresentSum" class="text-2xl font-black text-green-900">0명</p>
                </div>
            </div>

            <!-- Reports List Container -->
            <div id="reportsContainer" class="space-y-4 hidden fade-in">
                <!-- Report items injected via JS -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16 text-gray-400">
                <svg class="w-16 h-16 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-base font-medium">조건에 일치하는 보고서가 없습니다.</p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 목사님의 구글 Apps Script 웹앱 주소 입력 🚨
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoY5cXstdn7vkVvyiNNuKNL4BDn1NJrBiX_3pqRFGb84ymUwMCT_a1LzvHTxuLT-x8wQ/exec';
        // ==========================================

        let allReports = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadReports();
        });

        document.getElementById('filterDistrict').addEventListener('change', () => {
            renderReports();
        });

        document.getElementById('filterDate').addEventListener('change', () => {
            renderReports();
        });

        async function loadReports() {
            const loadingStatus = document.getElementById('loadingStatus');
            const summaryCards = document.getElementById('summaryCards');
            const reportsContainer = document.getElementById('reportsContainer');
            const emptyState = document.getElementById('emptyState');

            loadingStatus.classList.remove('hidden');
            summaryCards.classList.add('hidden');
            reportsContainer.classList.add('hidden');
            emptyState.classList.add('hidden');

            try {
                const response = await fetch(APPS_SCRIPT_URL + "?action=getReports");
                if (!response.ok) throw new Error('Network error');
                
                allReports = await response.json();

                // 날짜 드롭다운 목록 동적 생성 (중복 제거 및 최신순 정렬)
                populateDateDropdown(allReports);

                loadingStatus.classList.add('hidden');
                summaryCards.classList.remove('hidden');
                reportsContainer.classList.remove('hidden');

                renderReports();

            } catch (error) {
                loadingStatus.innerHTML = '<p class="text-red-500 font-bold">데이터를 불러오는데 실패했습니다.</p>';
                console.error(error);
            }
        }

        function populateDateDropdown(reports) {
            const dateSelect = document.getElementById('filterDate');
            const currentSelected = dateSelect.value;
            
            // 고유한 날짜 목록 추출
            const dates = [...new Set(reports.map(r => r.date))].filter(Boolean);
            // 내림차순(최신순) 정렬
            dates.sort((a, b) => new Date(b) - new Date(a));

            dateSelect.innerHTML = '<option value="전체">전체 날짜 모아보기 (최신순)</option>';
            dates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = date + " 주일";
                dateSelect.appendChild(option);
            });

            // 이전 선택값 유지 시도
            if (dates.includes(currentSelected)) {
                dateSelect.value = currentSelected;
            }
        }

        function renderReports() {
            const container = document.getElementById('reportsContainer');
            const emptyState = document.getElementById('emptyState');
            const filterDistrict = document.getElementById('filterDistrict').value;
            const filterDate = document.getElementById('filterDate').value;
            
            container.innerHTML = '';

            // 필터링 적용 (날짜 + 교구)
            let filtered = allReports.filter(r => {
                const matchDate = (filterDate === '전체' || r.date === filterDate);
                const matchDistrict = (filterDistrict === '전체' || (r.group && r.group.includes(filterDistrict)));
                return matchDate && matchDistrict;
            });

            // 통계 카드 업데이트
            document.getElementById('totalReportCount').textContent = filtered.length + '개';
            const totalPresent = filtered.reduce((acc, cur) => acc + (parseInt(cur.present) || 0), 0);
            document.getElementById('totalPresentSum').textContent = totalPresent + '명';

            if (filtered.length === 0) {
                emptyState.classList.add('fade-in');
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(rep => {
                const cardHTML = `
                    <div class="bg-white border border-gray-200 p-5 rounded-2xl shadow-sm hover:shadow-md transition-shadow fade-in">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full">${rep.group}</span>
                                <h3 class="text-lg font-bold text-gray-900 mt-2">속장: ${rep.leader}</h3>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-blue-600 font-semibold block bg-blue-50 px-2 py-0.5 rounded">주일: ${rep.date}</span>
                                <span class="inline-block mt-1 bg-green-100 text-green-800 text-xs font-bold px-2.5 py-1 rounded-lg">출석 ${rep.present} / 총원 ${rep.total}명</span>
                            </div>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 text-sm text-gray-700 mb-3">
                            <strong class="text-gray-900 block mb-1 text-xs">📋 출결 상세</strong>
                            <p class="leading-relaxed text-xs text-gray-600">${rep.attendance}</p>
                        </div>
                        ${rep.notes ? `
                            <div class="bg-red-50 p-3 rounded-xl border border-red-100 text-sm text-red-900">
                                <strong class="block mb-1 text-xs text-red-700">🙏 남기고 싶은 말</strong>
                                <p class="text-xs leading-relaxed">${rep.notes}</p>
                            </div>
                        ` : ''}
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }
    </script>
</body>
</html>
