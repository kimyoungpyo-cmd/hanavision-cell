<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>하나비전교회 사역자 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%;
            width: 32px; height: 32px; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* 부드러운 펼침 애니메이션 */
        .accordion-content { transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen pb-20">

    <div class="max-w-2xl mx-auto bg-white min-h-screen shadow-xl sm:my-6 sm:rounded-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-700 text-white p-6 shadow-md text-center sm:text-left">
            <h1 class="text-2xl font-bold tracking-tight">사역자 실시간 대시보드</h1>
            <p class="text-blue-100 text-sm mt-1">하나비전교회 교구별 보고 현황</p>
        </div>

        <!-- Filter Controls -->
        <div class="p-5 bg-blue-50 border-b">
            <label for="filterDate" class="block text-sm font-bold text-blue-900 mb-2">📅 주일 날짜 선택 (조회 기준)</label>
            <div class="flex gap-3 items-center">
                <input type="date" id="filterDate" class="flex-1 p-3 bg-white border border-blue-200 rounded-xl text-base font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm text-gray-700">
                <button onclick="renderDashboard()" class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm shadow transition-colors shrink-0">
                    조회하기
                </button>
            </div>
            <p class="text-xs text-blue-600 mt-2 ml-1">※ 선택하신 주일에 해당하는 보고서만 묶어서 보여줍니다.</p>
        </div>

        <!-- Main Content Area -->
        <div class="p-4 sm:p-6 bg-gray-50">
            <!-- Loading -->
            <div id="loadingStatus" class="text-center py-16 fade-in">
                <div class="loader mb-3"></div>
                <p class="text-sm text-gray-500 font-medium text-blue-600">데이터를 실시간으로 불러오는 중입니다...</p>
            </div>

            <!-- Dashboard Container (교구별 아코디언 리스트) -->
            <div id="dashboardContainer" class="space-y-4 hidden fade-in">
                <!-- JS를 통해 교구별 리스트가 여기에 주입됩니다. -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 목사님의 구글 Apps Script 웹앱 주소 입력 🚨
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoY5cXstdn7vkVvyiNNuKNL4BDn1NJrBiX_3pqRFGb84ymUwMCT_a1LzvHTxuLT-x8wQ/exec';
        // ==========================================

        let allReports = [];
        const districtsList = ["1교구", "2교구", "3교구", "4교구", "남성교구"];

        window.addEventListener('DOMContentLoaded', () => {
            loadReports();
        });

        // 교구 탭 열고 닫기 함수
        function toggleDistrict(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        async function loadReports() {
            const loadingStatus = document.getElementById('loadingStatus');
            const dashboardContainer = document.getElementById('dashboardContainer');

            try {
                const response = await fetch(APPS_SCRIPT_URL + "?action=getReports");
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                
                // 데이터 파싱 (시차 문제 완벽 해결)
                allReports = data.map(r => {
                    let cleanDate = "";
                    if (r.date) {
                        // UTC 시차로 밀려버린 날짜를 브라우저(한국) 로컬 날짜로 정확히 복원
                        const d = new Date(r.date);
                        const year = d.getFullYear();
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        cleanDate = `${year}-${month}-${day}`;
                    }

                    // 제출 시간 이쁘게 포맷팅
                    let submitStr = "";
                    if (r.timestamp) {
                        const t = new Date(r.timestamp);
                        submitStr = `${t.getMonth()+1}월 ${t.getDate()}일 ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
                    }

                    return { ...r, date: cleanDate, submitTime: submitStr };
                });

                // 가장 최근 주일 날짜를 찾아 달력 기본값으로 세팅
                const allDates = [...new Set(allReports.map(r => r.date))].filter(Boolean);
                allDates.sort((a, b) => new Date(b) - new Date(a));
                if (allDates.length > 0) {
                    document.getElementById('filterDate').value = allDates[0];
                }

                loadingStatus.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');

                renderDashboard();

            } catch (error) {
                loadingStatus.innerHTML = '<p class="text-red-500 font-bold">데이터를 불러오는데 실패했습니다.</p>';
                console.error(error);
            }
        }

        function renderDashboard() {
            const container = document.getElementById('dashboardContainer');
            const filterDate = document.getElementById('filterDate').value; 
            
            container.innerHTML = '';

            // 1. 선택한 주일 날짜로 전체 데이터 필터링
            let targetReports = allReports.filter(r => r.date === filterDate);

            // 2. 각 교구별로 카드 생성
            districtsList.forEach(dist => {
                // 해당 교구 데이터만 추려내기
                const distReports = targetReports.filter(r => r.group && r.group.includes(dist));
                
                const reportCount = distReports.length;
                const totalPresent = distReports.reduce((acc, cur) => acc + (parseInt(cur.present) || 0), 0);

                const distId = `dist-${dist.replace(/[^a-zA-Z0-9]/g, '')}`; // ID로 쓸 수 있게 공백 제거

                let html = `
                    <div class="bg-white border border-blue-200 rounded-2xl shadow-sm overflow-hidden fade-in">
                        <!-- 교구 요약 버튼 (누르면 열림) -->
                        <button onclick="toggleDistrict('${distId}')" class="w-full bg-white hover:bg-blue-50 p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-100 transition-colors">
                            <div class="flex items-center gap-3 w-full sm:w-auto mb-2 sm:mb-0">
                                <span class="text-xl font-extrabold text-blue-900">${dist}</span>
                                <span id="icon-${distId}" class="text-blue-400 transition-transform duration-200 ml-auto sm:ml-2">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </span>
                            </div>
                            <div class="flex gap-2 w-full sm:w-auto justify-between sm:justify-end">
                                <div class="bg-blue-100 text-blue-800 px-3 py-1.5 rounded-lg text-sm font-bold shadow-inner">
                                    제출 <span class="text-blue-600 text-base">${reportCount}</span> 속회
                                </div>
                                <div class="bg-green-100 text-green-800 px-3 py-1.5 rounded-lg text-sm font-bold shadow-inner">
                                    출석 <span class="text-green-600 text-base">${totalPresent}</span> 명
                                </div>
                            </div>
                        </button>
                        
                        <!-- 숨겨진 상세 내용 (아코디언) -->
                        <div id="${distId}" class="hidden p-4 sm:p-5 bg-gray-50 space-y-4">
                `;

                if (reportCount === 0) {
                    html += `
                        <div class="text-center py-6 text-gray-400">
                            <svg class="w-12 h-12 mx-auto mb-2 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <p class="text-sm font-medium">제출된 보고서가 없습니다.</p>
                        </div>
                    `;
                } else {
                    distReports.forEach(rep => {
                        html += `
                            <div class="bg-white border border-gray-200 p-4 rounded-xl shadow-sm">
                                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 border-b pb-3">
                                    <div class="mb-2 sm:mb-0">
                                        <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-1 rounded shadow-sm">${rep.group}</span>
                                        <h4 class="text-base font-bold text-gray-900 mt-2">속장: ${rep.leader}</h4>
                                    </div>
                                    <div class="text-left sm:text-right">
                                        <span class="text-xs text-gray-400 block mb-1">제출: ${rep.submitTime}</span>
                                        <span class="inline-block bg-green-50 border border-green-200 text-green-800 text-xs font-bold px-2 py-1 rounded">출석 ${rep.present}명 (총 ${rep.total}명)</span>
                                    </div>
                                </div>
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 text-sm text-gray-700 mb-2">
                                    <strong class="text-gray-900 block mb-1 text-xs">📋 출결 상세</strong>
                                    <p class="leading-relaxed text-xs text-gray-600">${rep.attendance}</p>
                                </div>
                                ${rep.notes ? `
                                    <div class="bg-red-50 p-3 rounded-lg border border-red-100 text-sm text-red-900">
                                        <strong class="block mb-1 text-xs text-red-700">🙏 남기고 싶은 말</strong>
                                        <p class="text-xs leading-relaxed">${rep.notes}</p>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                }

                html += `
                        </div>
                    </div>
                `;
                
                container.insertAdjacentHTML('beforeend', html);
            });
        }
    </script>
</body>
</html>
