<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>속회 주일예배보고</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .attendance-radio:checked + label[for$="-present"] { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .attendance-radio:checked + label[for$="-absent"] { background-color: #ef4444; color: white; border-color: #ef4444; }
        .attendance-radio:checked + label[for$="-uncontacted"] { background-color: #f59e0b; color: white; border-color: #f59e0b; }

        /* Loader Animation */
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%;
            width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-blue-50 text-gray-800 font-sans antialiased min-h-screen">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg sm:my-8 sm:rounded-2xl overflow-hidden pb-20">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-6 text-center shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-tight">속회 주일예배보고</h1>
            <p class="text-blue-100 text-sm mt-1">하나비전교회</p>
        </div>

        <form id="reportForm" class="p-6 space-y-8">
            
            <!-- Loading Status -->
            <div id="loadingStatus" class="text-center py-4 fade-in">
                <div class="loader mb-2"></div>
                <p class="text-sm text-blue-600 font-medium">최신 조직도를 불러오는 중입니다...</p>
            </div>

            <!-- 1. Basic Info Section -->
            <div id="basicInfoSection" class="space-y-4 hidden">
                <h2 class="text-lg font-semibold border-b pb-2 text-blue-800 flex items-center">
                    <span class="bg-blue-100 text-blue-800 w-6 h-6 rounded-full inline-flex items-center justify-center text-sm mr-2">1</span>
                    기본 정보
                </h2>

                <!-- 교구 선택 (상위 카테고리) -->
                <div>
                    <label for="districtGroup" class="block text-sm font-medium text-gray-700 mb-1">교구 선택 *</label>
                    <select id="districtGroup" name="districtGroup" required class="block w-full pl-3 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-xl border bg-gray-50 shadow-sm appearance-none">
                        <option value="" disabled selected>교구를 선택해주세요</option>
                        <option value="1교구">1교구</option>
                        <option value="2교구">2교구</option>
                        <option value="3교구">3교구</option>
                        <option value="4교구">4교구</option>
                        <option value="남성교구">남성교구</option>
                    </select>
                </div>

                <!-- 속회 선택 (하위 카테고리) -->
                <div id="cellGroupContainer" class="hidden fade-in">
                    <label for="cellGroup" class="block text-sm font-medium text-gray-700 mb-1">상세 속회 선택 *</label>
                    <select id="cellGroup" name="cellGroup" required class="block w-full pl-3 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-xl border bg-gray-50 shadow-sm appearance-none">
                        <option value="" disabled selected>먼저 교구를 선택해주세요</option>
                        <!-- Options will be populated based on district selection -->
                    </select>
                </div>

                <div id="leaderInfoContainer" class="hidden fade-in bg-blue-50 p-4 rounded-xl border border-blue-100 mt-4">
                    <p class="text-sm text-gray-600 mb-1">보고자 (속장)</p>
                    <p id="leaderNameDisplay" class="font-bold text-lg text-blue-900">-</p>
                    <input type="hidden" id="leaderName" name="leaderName">
                </div>

                <div>
                    <label for="meetingDate" class="block text-sm font-medium text-gray-700 mb-1">주일 날짜 *</label>
                    <input type="date" id="meetingDate" name="meetingDate" required class="block w-full pl-3 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-xl border bg-gray-50 shadow-sm">
                    <p class="text-xs text-gray-500 mt-1 pl-1">※ 가장 최근 주일 날짜로 자동 설정됩니다.</p>
                </div>
            </div>

            <!-- 2. Member Attendance Section -->
            <div id="attendanceSection" class="space-y-4 hidden fade-in">
                <h2 class="text-lg font-semibold border-b pb-2 text-blue-800 flex items-center">
                    <span class="bg-blue-100 text-blue-800 w-6 h-6 rounded-full inline-flex items-center justify-center text-sm mr-2">2</span>
                    주일 출석 확인
                </h2>
                <div class="flex justify-between items-center text-sm text-gray-600 bg-gray-50 p-3 rounded-lg border">
                    <span>총원: <strong id="totalCount" class="text-blue-700">0</strong>명</span>
                    <span>출석: <strong id="presentCount" class="text-blue-700">0</strong>명</span>
                </div>

                <div id="membersContainer" class="space-y-5">
                    <!-- Member items will be injected here via JavaScript -->
                </div>
            </div>

            <!-- 3. Report Details Section -->
            <div id="detailsSection" class="space-y-4 hidden fade-in">
                <h2 class="text-lg font-semibold border-b pb-2 text-blue-800 flex items-center mt-8">
                    <span class="bg-blue-100 text-blue-800 w-6 h-6 rounded-full inline-flex items-center justify-center text-sm mr-2">3</span>
                    보고 내용
                </h2>

                <div>
                    <label for="generalNotes" class="block text-sm font-medium text-gray-700 mb-1">남기고 싶은 말 (선택사항)</label>
                    <textarea id="generalNotes" name="generalNotes" rows="5" placeholder="기도제목, 심방 요청, 교구 목사님께 전달하고 싶은 내용을 자유롭게 적어주세요." class="block w-full pl-3 pr-3 py-3 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-xl border bg-gray-50 shadow-sm"></textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <div id="submitContainer" class="pt-6 hidden fade-in">
                <button type="submit" id="submitBtn" class="w-full flex justify-center items-center py-4 px-4 border border-transparent rounded-xl shadow-md text-lg font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    <span>보고서 제출하기</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="hidden fixed z-50 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-sm sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4 text-center">
                    <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                        <svg class="h-10 w-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                    <h3 class="text-xl leading-6 font-bold text-gray-900" id="modal-title">제출 완료</h3>
                    <div class="mt-2">
                        <p class="text-sm text-gray-500">주일예배보고가 성공적으로 제출되었습니다. 감사합니다.</p>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" onclick="location.reload()" class="w-full inline-flex justify-center rounded-xl border border-transparent shadow-sm px-4 py-3 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                        새로고침
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 목사님의 Google Apps Script 웹앱 주소 입력 🚨
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoY5cXstdn7vkVvyiNNuKNL4BDn1NJrBiX_3pqRFGb84ymUwMCT_a1LzvHTxuLT-x8wQ/exec';
        // ==========================================

        let cellData = {};
        
        // DOM Elements
        const form = document.getElementById('reportForm');
        const districtGroupSelect = document.getElementById('districtGroup');
        const cellGroupContainer = document.getElementById('cellGroupContainer');
        const cellGroupSelect = document.getElementById('cellGroup');
        const leaderInfoContainer = document.getElementById('leaderInfoContainer');
        const leaderNameDisplay = document.getElementById('leaderNameDisplay');
        const leaderNameInput = document.getElementById('leaderName');
        const attendanceSection = document.getElementById('attendanceSection');
        const detailsSection = document.getElementById('detailsSection');
        const submitContainer = document.getElementById('submitContainer');
        const membersContainer = document.getElementById('membersContainer');
        const totalCountEl = document.getElementById('totalCount');
        const presentCountEl = document.getElementById('presentCount');
        const loadingStatus = document.getElementById('loadingStatus');
        const basicInfoSection = document.getElementById('basicInfoSection');
        const submitBtn = document.getElementById('submitBtn');

        let memberCount = 0;
        let presentCount = 0;

        // Date Setup: 가장 최근 주일(Sunday) 날짜 구하기
        function getMostRecentSunday() {
            const today = new Date();
            const dayOfWeek = today.getDay(); // 0 is Sunday
            const diff = dayOfWeek === 0 ? 0 : dayOfWeek; 
            
            const lastSunday = new Date(today);
            lastSunday.setDate(today.getDate() - diff);
            
            const year = lastSunday.getFullYear();
            const month = String(lastSunday.getMonth() + 1).padStart(2, '0');
            const day = String(lastSunday.getDate()).padStart(2, '0');
            
            return `${year}-${month}-${day}`;
        }
        
        document.getElementById('meetingDate').value = getMostRecentSunday();

        // 1. Fetch Organization Data from Google Sheets
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                cellData = await response.json();

                // Hide loader, show form
                loadingStatus.classList.add('hidden');
                basicInfoSection.classList.remove('hidden');

            } catch (error) {
                loadingStatus.innerHTML = '<p class="text-red-500">데이터를 불러오는데 실패했습니다. 새로고침 해주세요.</p>';
                console.error('Error fetching data:', error);
            }
        });

        // 💡 상위 카테고리 (교구) 선택 시 하위 속회 필터링
        districtGroupSelect.addEventListener('change', function() {
            const selectedDistrict = this.value; 
            
            cellGroupSelect.innerHTML = '<option value="" disabled selected>상세 속회를 선택해주세요</option>';
            
            let hasOptions = false;
            Object.keys(cellData).forEach(group => {
                if (group.startsWith(selectedDistrict)) {
                    const option = document.createElement('option');
                    option.value = group;
                    // "1교구 구곡지역 1속" 에서 "1교구 " 부분을 잘라내고 "구곡지역 1속"만 노출
                    option.textContent = group.replace(selectedDistrict + " ", ""); 
                    cellGroupSelect.appendChild(option);
                    hasOptions = true;
                }
            });

            if (hasOptions) {
                cellGroupContainer.classList.remove('hidden');
            } else {
                cellGroupSelect.innerHTML = '<option value="" disabled selected>해당 교구에 속회 데이터가 없습니다</option>';
                cellGroupContainer.classList.remove('hidden');
            }
            
            // 기존 선택된 정보 초기화
            resetLowerSections();
        });

        cellGroupSelect.addEventListener('change', function() {
            const selectedGroup = this.value; 
            
            if (selectedGroup && cellData[selectedGroup]) {
                const groupInfo = cellData[selectedGroup];
                leaderNameDisplay.textContent = groupInfo.leader || "미지정";
                leaderNameInput.value = groupInfo.leader || "";
                leaderInfoContainer.classList.remove('hidden');

                generateMemberUI(groupInfo.members);

                attendanceSection.classList.remove('hidden');
                detailsSection.classList.remove('hidden');
                submitContainer.classList.remove('hidden');
            }
        });

        function resetLowerSections() {
            leaderInfoContainer.classList.add('hidden');
            attendanceSection.classList.add('hidden');
            detailsSection.classList.add('hidden');
            submitContainer.classList.add('hidden');
        }

        function generateMemberUI(members) {
            membersContainer.innerHTML = '';
            memberCount = members.length;
            presentCount = 0;
            updateCounters();

            members.forEach((member, index) => {
                const baseId = `member_${index}`;
                const safeName = member.replace(/\s+/g, '');
                
                const memberHTML = `
                    <div class="bg-white p-4 rounded-xl border shadow-sm member-card" data-member-name="${member}">
                        <div class="font-bold text-gray-800 mb-3 text-lg">${member}</div>
                        <div class="flex space-x-2 mb-3">
                            <div class="flex-1 relative">
                                <input type="radio" id="${baseId}-present" name="attendance_${safeName}" value="출석" class="attendance-radio hidden" onchange="handleAttendanceChange('${baseId}', '${safeName}', '출석')">
                                <label for="${baseId}-present" class="block text-center py-2 px-1 border border-gray-300 rounded-lg cursor-pointer text-sm font-medium text-gray-600 transition-colors">출석</label>
                            </div>
                            <div class="flex-1 relative">
                                <input type="radio" id="${baseId}-absent" name="attendance_${safeName}" value="결석" class="attendance-radio hidden" onchange="handleAttendanceChange('${baseId}', '${safeName}', '결석')">
                                <label for="${baseId}-absent" class="block text-center py-2 px-1 border border-gray-300 rounded-lg cursor-pointer text-sm font-medium text-gray-600 transition-colors">결석</label>
                            </div>
                            <div class="flex-1 relative">
                                <input type="radio" id="${baseId}-uncontacted" name="attendance_${safeName}" value="미연락" class="attendance-radio hidden" onchange="handleAttendanceChange('${baseId}', '${safeName}', '미연락')">
                                <label for="${baseId}-uncontacted" class="block text-center py-2 px-1 border border-gray-300 rounded-lg cursor-pointer text-sm font-medium text-gray-600 transition-colors shrink-0 whitespace-nowrap">미연락</label>
                            </div>
                        </div>
                        <div id="${baseId}-reason-container" class="hidden fade-in">
                            <input type="text" id="${baseId}-reason" name="reason_${safeName}" placeholder="사유를 간단히 적어주세요 (필수)" class="block w-full pl-3 pr-3 py-2 text-sm border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 rounded-lg border bg-gray-50 shadow-inner reason-input">
                        </div>
                    </div>
                `;
                membersContainer.insertAdjacentHTML('beforeend', memberHTML);
            });
        }

        window.handleAttendanceChange = function(baseId, safeName, status) {
            const reasonContainer = document.getElementById(`${baseId}-reason-container`);
            const reasonInput = document.getElementById(`${baseId}-reason`);
            if (status === '결석' || status === '미연락') {
                reasonContainer.classList.remove('hidden');
                reasonInput.required = true;
            } else {
                reasonContainer.classList.add('hidden');
                reasonInput.required = false;
                reasonInput.value = '';
            }
            calculatePresentCount();
        };

        function calculatePresentCount() {
            const allPresentRadios = document.querySelectorAll('input[type="radio"][value="출석"]:checked');
            presentCount = allPresentRadios.length;
            updateCounters();
        }

        function updateCounters() {
            totalCountEl.textContent = memberCount;
            presentCountEl.textContent = presentCount;
        }

        // 2. Submit Data to Google Sheets
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validation
            const memberCards = document.querySelectorAll('.member-card');
            let allSelected = true;
            let attendanceDetails = [];
            
            memberCards.forEach((card) => {
                const radios = card.querySelectorAll('input[type="radio"]');
                const checkedRadio = Array.from(radios).find(radio => radio.checked);
                const memberName = card.getAttribute('data-member-name');
                const reasonInput = card.querySelector('.reason-input');

                if (!checkedRadio) {
                    allSelected = false;
                    card.classList.add('border-red-400', 'bg-red-50');
                    setTimeout(() => card.classList.remove('border-red-400', 'bg-red-50'), 2000);
                } else {
                    attendanceDetails.push({
                        name: memberName,
                        status: checkedRadio.value,
                        reason: reasonInput.value || ""
                    });
                }
            });

            if (!allSelected) {
                alert("모든 속도원의 주일 출석 상태를 선택해주세요.");
                return;
            }

            // Build Payload (모임 형태 삭제)
            const formData = new FormData(form);
            const payload = {
                cellGroup: formData.get('cellGroup'), 
                leaderName: formData.get('leaderName'),
                meetingDate: formData.get('meetingDate'),
                totalCount: memberCount,
                presentCount: presentCount,
                generalNotes: formData.get('generalNotes') || "",
                attendanceDetails: attendanceDetails
            };

            // Loading state
            submitBtn.innerHTML = '<div class="loader"></div>';
            submitBtn.disabled = true;

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                if(result.status === "success") {
                    document.getElementById('successModal').classList.remove('hidden');
                } else {
                    throw new Error("서버 에러");
                }
            } catch (error) {
                alert("제출 중 오류가 발생했습니다. 다시 시도해주세요.");
                submitBtn.innerHTML = '<span>보고서 제출하기</span>';
                submitBtn.disabled = false;
                console.error(error);
            }
        });
    </script>
</body>
